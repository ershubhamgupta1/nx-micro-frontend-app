name: Publish Shared Component Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'shared-component-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared-common package
        run: npx nx build shared-common

      - name: Publish package to npm
        run: npm publish
        working-directory: dist/libs/shared/common
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
